  thermal_battery_log:
    name: ThermalBattery
    filename: /conf/apps/thermal_battery/thermal_battery.log
    log_size: 1048576       # 1 MB per file
    log_generations: 10     # keep 10 rotated files
    format: "{asctime}.{msecs:03.0f} {levelname:<7} {message}"
    date_format: "%Y-%m-%d %H:%M:%S"

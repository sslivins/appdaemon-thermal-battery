thermal_battery:
  module: thermal_battery
  class: ThermalBattery
  log: thermal_battery_log

  timezone: America/Vancouver

  # Start in shadow mode: never touches a setpoint, but plans, logs what it
  # would do, and learns k from the backstop (12C thermostat) heat.
  dry_run: true
  # Zones that charge for real anyway (staged rollout out of shadow mode).
  live_zones: [master_bedroom, main_floor]
  # Probe runs: a short call per zone (dry_run zones too) in the lead-up
  # to the window; the first minutes of return water read the slab.
  probe:
    enabled: true
    minutes: 10
    lead_min: 45            # start this long before the window opens
    recent_call_min: 90     # skip a zone that called this recently

  # Only operate while the house is in AWAY mode.
  away_entity: input_boolean.home_away_mode_enabled
  away_state: "on"
  # Charging pauses (and restores baselines) while the electric backup runs.
  backup_entity: binary_sensor.aeco_1988_backup_running

  # Common radiant supply header (thermux).
  radiant_supply_entity: sensor.thermux_radiant_supply

  away_setpoint: 12.0       # thermostat baseline / backstop
  charge_setpoint: 22.0     # setpoint used to force a zone call while charging
  target_low: 12.5          # desired overnight-to-morning air low
  overshoot_deadband_c: 0.5 # low above target+this (and no backstop) => overshoot
  overshoot_frac_per_c: 0.15
  unplanned_eps: 20         # C*min of backstop heat treated as "none"
  unplanned_min_eps: 10     # ...and backstop call minutes treated as "none"
  hdh_base_c: 15.0          # heating-degree-hour balance point

  grade_time: "09:00"       # cycle boundary: grade yesterday, plan today
  night_start: "22:00"      # morning-low search window = night_start..grade_time
  window_earliest: "11:00"  # charging window = warmest window_hours block
  window_latest: "19:00"    #   inside [earliest, latest]
  window_hours: 5
  min_session_min: 30       # don't start a charge with less window left
  max_concurrent: 2         # zones charging at once
  flush_min: 3              # ignore dT for this long after each call starts
  backup_cooldown_min: 20

  learn_alpha: 0.3          # k += alpha * (k_obs - k)
  max_step_frac: 0.25       # max daily k change
  min_learn_hdh: 10         # skip learning on mild days

  weather:                  # Open-Meteo (no key). House coords from HA.
    latitude: 50.8846
    longitude: -119.8633
    elevation: 1315
    # Open-Meteo model. best_match resolves to GFS here; Environment Canada's
    # HRDPS blend was ~0.5C closer at night vs the house/AECO/HP1 outdoor
    # sensors (10-day check, Oct 2026).
    model: gem_seamless
    window_azimuth: 202.5   # compass bearing the main glass faces (SSW)
    window_tilt: 90         # vertical windows
    refresh_min: 30
    stale_hours: 3          # scream if no good fetch for this long

  # Probe readings unchanged this long *while water flows past them* => alarm
  # (HA drops identical MQTT payloads, so stable-when-idle is normal).
  sensor_stale_min: 30
  # Extra notify services to call on a new problem (e.g. notify/mobile_app_x).
  notify_services: []

  # Logged with every sample (context for the solar model).
  lux_entity: sensor.usl_environmental_illuminance_3
  # Measured outdoor temp = the coldest of these (sun on a probe or a
  # probe's housing mass only ever reads warm). Used for actual HDH at grade
  # and predictor training; the forecast is still what plans. AECO/Generac
  # probes are excluded (housing mass keeps them ~3C warm in the evening).
  outdoor_entities:
    - sensor.usl_environmental_temperature_3
    - sensor.mechanical_room_macon_heat_pump_controller_fcec_hp_1_outdoor_temperature
    - sensor.mechanical_room_macon_heat_pump_controller_e540_hp_2_outdoor_temperature

  # Shadow predictor: at plan time and these replan times, predict each zone's
  # no-heat morning low (min of 30-min medians in the last morning_hours of
  # the cycle) and score it at grade time against last night's low
  # (persistence). Logging only - never changes budgets.
  predict:
    enabled: true
    times: ["12:00", "15:00", "18:00"]
    train_days: 21
    min_train_days: 3
    ridge_lambda: 0.05
    blend: 1.0          # model weight vs last night's low (1 = model only)
    slab: true          # also log the air+slab Kalman model (tb_slab)
    morning_hours: 6
  # Phone push via the home HA (BDL has no mobile_app). Test by firing the
  # HA event `thermal_battery_test_notify` on BDL.
  remote_notify:
    - url: http://192.168.1.192:8123
      token: !secret mi_ha_notify_token
      service: notify.mobile_app_stefan

  # Charge order = list order (big zones first). k units: C*min per C*h.
  zones:
    - name: main_floor
      climate: climate.main_floor
      covers:
        - cover.kitchen_left_window
        - cover.kitchen_right_window
        - cover.living_room_large_window_shade
        - cover.living_room_small_window
        - cover.office_large_window_shades
        - cover.office_small_window
      return_entity: sensor.thermux_main_floor_return
      floor_entities:
        - sensor.dining_room_bdl_temperature
        - sensor.foyer_bdl_temperature
        - sensor.kitchen_bdl_temperature
        - sensor.living_room_bdl_temperature
        - sensor.powder_room_bdl_temperature
      k_init: 5.0
      max_run_min: 240
    - name: basement_bunk_rooms
      climate: climate.basement_bunk_rooms
      air_coarse: true   # thermostat reports whole degF
      covers:
        - cover.double_bunk_room_bedroom_shades
        - cover.queen_and_bunk_bedroom_window_shade
        - cover.basement_game_area_small_window
      return_entity: sensor.thermux_basement_return
      k_init: 5.0
      max_run_min: 240
    - name: master_bedroom
      climate: climate.master_bedroom
      covers:
        - cover.master_bedroom_large_window_shade
        - cover.master_bedroom_window_24
        - cover.master_bedroom_window_24_1
        - cover.master_bedroom_window_25
        - cover.master_bedroom_window_25_1
        - cover.master_bedroom_window_26
      return_entity: sensor.thermux_master_return
      floor_entities:
        - sensor.master_bedroom_bdl_temperature
        - sensor.master_bedroom_closet_bdl_temperature
        - sensor.master_bathroom_bdl_temperature
      k_init: 1.2
      max_run_min: 120
    - name: basement_master
      climate: climate.basement_master
      air_coarse: true   # thermostat reports whole degF
      covers:
        - cover.basement_master_bedroom_large_window_shade
        - cover.basement_master_bedroom_small_shades
      return_entity: sensor.thermux_basement_master_return_ada
      k_init: 1.0
      max_run_min: 120
      probe_min: 15      # hot front takes ~9.5 min round this loop
    - name: ski_room
      climate: climate.ski_room
      air_coarse: true   # thermostat reports whole degF
      return_entity: sensor.thermux_ski_room_return
      floor_entities:
        - sensor.ski_room_bdl_temperature
      k_init: 0.6
      max_run_min: 120

  mqtt_enabled: true
  mqtt_host: 192.168.10.212
  mqtt_port: 1883
  mqtt_username: arctic_sniffer
  mqtt_password: !secret arctic_mqtt_password
  mqtt_discovery_prefix: homeassistant
